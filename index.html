<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis páginas — Lester Manzano</title>
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mis páginas">
<meta name="theme-color" content="#141414">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Arial,sans-serif;background:#141414;color:#f5f5f5;line-height:1.55;min-height:100vh}
.demo-bar{background:#000;color:#f5c542;text-align:center;font-size:12px;padding:8px 12px;letter-spacing:1px;font-weight:bold}
header{text-align:center;padding:40px 20px 10px}
header h1{font-size:30px;letter-spacing:1px}
header h1 span{color:#f5c542}
header p{color:#b9a86a;margin-top:8px;font-size:15px}
.topnav{position:sticky;top:0;z-index:50;background:#0d0d0d;border-bottom:1px solid #3a3a3a;display:flex;justify-content:center;gap:8px;padding:10px 12px;flex-wrap:wrap;min-height:52px}
.topnav a{color:#f5f5f5;text-decoration:none;font-size:14px;font-weight:bold;padding:8px 16px;border-radius:20px;border:1px solid #3a3a3a}
.topnav a:hover{border-color:#f5c542}
.seccion{scroll-margin-top:70px}
html{scroll-behavior:smooth}
main{max-width:640px;margin:0 auto;padding:24px 20px 40px}
.seccion{margin-bottom:36px}
.sec-head{text-align:center;margin-bottom:16px}
.sec-head h2{font-size:22px;letter-spacing:.5px}
.sec-head p{color:#8a7a4a;font-size:13px;margin-top:2px}
.seccion .card, .seccion .empty{margin-bottom:14px}
.empty{background:#1a1a1a;border:1px dashed #4a4a4a;border-radius:12px;padding:18px;text-align:center;color:#8a8a8a;font-size:14px}
.card{background:#1f1f1f;border:1px solid #3a3a3a;border-left:4px solid #f5c542;border-radius:12px;padding:20px;text-decoration:none;color:inherit;display:block}
.card:hover{border-color:#f5c542}
.card .tag{font-size:11px;font-weight:bold;letter-spacing:1px;color:#f5c542;text-transform:uppercase}
.card h2{font-size:19px;margin:6px 0 4px}
.card p{font-size:14px;color:#c9c9c9}
.card .url{font-size:12px;color:#f5c542;margin-top:10px;word-break:break-all}
footer{text-align:center;padding:24px;font-size:13px;color:#8a7a4a}
footer b{color:#f5c542}
</style>
</head>
<body>
<div class="demo-bar">&#9733; PANEL PRIVADO &mdash; SOLO PARA TI &#9733;</div>
<header>
<h1>MIS <span>P&Aacute;GINAS</span></h1>
<p>Todos tus sitios publicados en un solo lugar</p>
</header>
<nav class="topnav">
</nav>
<main>
<div class="empty">Cargando páginas…</div>
</main>
<footer><b>LESTER MANZANO</b> &middot; 813 235 3313</footer>
<script>
/* Demos al instante: lee secciones y páginas de Supabase (admin del portal). */
const DEMOS_SUPABASE_URL = "https://ildviocjmqcyfknzlyrm.supabase.co";
const DEMOS_SUPABASE_KEY = "sb_publishable_b6X_FUcoooXAvUWI6UXT-g_Zu4ZHi0g";
(async () => {
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const nav = document.querySelector('.topnav');
  const main = document.querySelector('main');
  try {
    const r = await fetch(DEMOS_SUPABASE_URL + "/rest/v1/demo_secciones?select=*,demo_paginas(*)&demo_paginas.estado=eq.terminado&demo_paginas.visible=eq.true&order=orden.asc&demo_paginas.order=orden.asc",
      { headers: { apikey: DEMOS_SUPABASE_KEY, Authorization: "Bearer " + DEMOS_SUPABASE_KEY } });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const secs = (await r.json()).filter(s => (s.demo_paginas || []).length);
    nav.innerHTML = secs.map(s => `<a href="#sec-${esc(s.slug)}">${esc(((s.bandera || '') + ' ' + s.nombre).trim())}</a>`).join('');
    main.innerHTML = secs.map(s => {
      const head = s.titulo_panel
        ? `<div class="sec-head"><h2>${esc(s.titulo_panel)}</h2><p>${esc(s.subtitulo_panel || '')}</p></div>` : '';
      const cards = s.demo_paginas.map(p => {
        const corta = String(p.url || '').replace(/^https?:\/\//, '');
        return `<a class="card" href="${esc(p.url)}">`
          + `<div class="tag">${esc(p.tag || '')}</div>`
          + `<h2>${esc(p.titulo)}</h2>`
          + `<p>${esc(p.descripcion || '')}</p>`
          + `<div class="url">${esc(corta)}</div></a>`;
      }).join('\n');
      return `<div class="seccion" id="sec-${esc(s.slug)}">\n${head}\n${cards}\n</div>`;
    }).join('\n');
  } catch (e) {
    main.innerHTML = '<div class="empty">No se pudieron cargar las páginas. Revisa tu conexión e intenta de nuevo.</div>';
  }
})();
</script>
</body>
</html>
